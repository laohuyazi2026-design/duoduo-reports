# Jekyll Configuration for 多多研究報告部落格

title: 多多研究報告
description: 財經研究報告部落格
remote_theme: just-the-docs/just-the-docs
baseurl: "/duoduo-reports"
url: "https://laohuyazi2026-design.github.io"

# Just the Docs settings
just_the_docs:
  theme: "main"
  search_enabled: true
  search_heading_level: 2
  aux_links:
    "GitHub":
      - "//github.com/laohuyazi2026-design/duoduo-reports"

# Plugins
plugins:
  - jekyll-remote-theme

# Exclude slides from Jekyll processing
exclude:
  - slides/

# Markdown settings
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    disable: true

# Collections
collections:
  reports:
    output: true
    permalink: /:path/
